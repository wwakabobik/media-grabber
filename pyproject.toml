[project]
name = "media-grabber"
version = "0.1.0"
description = "Desktop app: paste a YouTube/Vimeo/Spotify URL, pick a format, download, preview in-app"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.12.0",
    "yt-dlp>=2026.8.19",
    "spotdl>=4.5.2",
    "structlog>=26.1.0",
    "yandex-music>=3.2.2",
    "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
