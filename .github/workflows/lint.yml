name: Lint & Test

# Runs on every push to any branch except master (master is only ever
# reached via a reviewed, already-green PR merge).
on:
  push:
    branches-ignore:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q
